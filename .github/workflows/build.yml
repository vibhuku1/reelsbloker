name: Build ReelStoper AAB & APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests
        run: gradle test

      - name: Decode release keystore (if configured)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
          fi

      - name: Build Release AAB (Google Play Bundle)
        env:
          RELEASE_KEYSTORE_PATH: app/release-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle bundleRelease

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ReelStoper-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ReelStoper-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
